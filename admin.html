<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameCache Admin</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200" />
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <h1>GameCache Admin</h1>
      <a href="/">Back to collection</a>
    </header>

    <section class="admin-card">
      <h2>Sync status</h2>
      <dl class="admin-status-list">
        <dt>Database ready</dt><dd id="admin-db-ready">Checking...</dd>
        <dt>Sync status</dt><dd id="admin-sync-status">Checking...</dd>
        <dt>Games indexed</dt><dd id="admin-game-count">-</dd>
        <dt>Last update</dt><dd id="admin-updated-at">-</dd>
      </dl>
      <p id="admin-error" class="admin-error" hidden></p>
      <button type="button" class="primary-btn" id="admin-sync-btn">Run sync now</button>
    </section>

    <section class="admin-card">
      <h2>Health endpoints</h2>
      <ul class="admin-links">
        <li><a href="/health" target="_blank">/health</a></li>
        <li><a href="/ready" target="_blank">/ready</a></li>
        <li><a href="/api/status" target="_blank">/api/status</a></li>
      </ul>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
