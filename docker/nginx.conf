server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
    gzip_vary on;

    location /health {
        proxy_pass http://127.0.0.1:9090/health;
    }

    location /ready {
        proxy_pass http://127.0.0.1:9090/ready;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9090/api/;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files /manifest.webmanifest =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /gamecache.sqlite.gz {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /gamecache.sqlite.gz =404;
    }

    location = /config.ini {
        add_header Content-Type text/plain;
        try_files /config.ini =404;
    }
}
