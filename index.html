<!DOCTYPE html>
<html lang="en">
<head>
  <title>All my boardgames</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2ea" id="themeColorMeta">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlayChest">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/meeple.svg">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200" />
  <script>
    (function () {
      const stored = localStorage.getItem('gamecacheTheme');
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/fflate.js"></script>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">You are offline. Browsing the cached collection.</div>
  <button type="button" class="reload-banner" id="reloadBanner" hidden>Collection updated. Click to reload.</button>

  <header class="search">
    <div class="searchTop">
      <a class="brand" href="./" aria-label="PlayChest home">
        <img class="logo" src="icons/meeple.svg" alt="" height="32" width="32">
        <span class="brandName">PlayChest</span>
      </a>
      <div class="search-box" id="search-box">
        <span class="material-symbols-rounded searchIcon" aria-hidden="true">search</span>
        <kbd class="searchHint" aria-hidden="true">/</kbd>
      </div>
      <nav class="toolbar" id="toolbar" aria-label="Game night tools">
        <button type="button" class="toolbar-btn toolbar-btn-primary" id="random-game-btn" title="Pick a random game from the current results">
          <span class="material-symbols-rounded icon-medium" aria-hidden="true">casino</span>
          <span class="toolbar-label">Pick for us</span>
        </button>
        <button type="button" class="toolbar-btn" id="bothOfUsBtn" title="Take turns keeping or vetoing games">
          <span class="material-symbols-rounded icon-medium" aria-hidden="true">favorite</span>
          <span class="toolbar-label">Both of us</span>
        </button>
        <button type="button" class="toolbar-btn" id="nightsBtn" title="Saved filter presets">
          <span class="material-symbols-rounded icon-medium" aria-hidden="true">bookmarks</span>
          <span class="toolbar-label">Nights</span>
        </button>
        <button type="button" class="toolbar-btn" id="compareBtn" title="Compare two games">
          <span class="material-symbols-rounded icon-medium" aria-hidden="true">compare</span>
          <span class="toolbar-label">Compare</span>
        </button>
        <button type="button" class="toolbar-btn" id="stats-btn" title="Collection statistics">
          <span class="material-symbols-rounded icon-medium" aria-hidden="true">bar_chart</span>
          <span class="toolbar-label">Stats</span>
        </button>
      </nav>
      <button type="button" class="iconBtn theme-toggle" id="themeToggle" title="Switch to dark theme" aria-label="Switch to dark theme">
        <span class="material-symbols-rounded icon-medium theme-icon-light" aria-hidden="true">dark_mode</span>
        <span class="material-symbols-rounded icon-medium theme-icon-dark" aria-hidden="true">light_mode</span>
      </button>
    </div>
    <div class="quickBar" id="quickBar">
      <div class="quickGroup" id="quickPlayers" role="radiogroup" aria-label="Players" hidden></div>
      <div class="quickGroup" id="quickTime" role="radiogroup" aria-label="Playing time" hidden></div>
      <button type="button" class="quickFiltersBtn" id="filtersBtn" title="All filters">
        <span class="material-symbols-rounded icon-small" aria-hidden="true">tune</span>
        <span>More filters</span>
        <span class="filterCountBadge" id="filterCountBadge" hidden></span>
      </button>
    </div>
    <div class="searchMeta">
      <div class="stats" id="stats" aria-live="polite"></div>
      <button type="button" class="linkBtn" id="quickClearBtn" hidden>Clear all</button>
      <div class="sort-group">
        <label for="sort-select">Sort</label>
        <div class="sort-by" id="sort-by"></div>
      </div>
      <div class="view-toggle" id="view-toggle" role="group" aria-label="Layout">
        <button type="button" class="view-btn is-active" data-view="grid" title="Grid view" aria-label="Grid view">
          <span class="material-symbols-rounded icon-small" aria-hidden="true">grid_view</span>
        </button>
        <button type="button" class="view-btn" data-view="list" title="List view" aria-label="List view">
          <span class="material-symbols-rounded icon-small" aria-hidden="true">view_list</span>
        </button>
        <button type="button" class="view-btn" data-view="compact" title="Compact view" aria-label="Compact view">
          <span class="material-symbols-rounded icon-small" aria-hidden="true">apps</span>
        </button>
      </div>
    </div>
  </header>
  <div class="compareBanner" id="compareBanner" hidden>
    <span id="compareBannerText">Click two games to compare</span>
    <button type="button" class="secondary-btn" id="compareBannerCancel">Cancel</button>
  </div>
  <div class="filterSheet" id="filterSheet" hidden>
    <div class="filterSheetPanel" role="dialog" aria-modal="true" aria-labelledby="filterSheetTitle" tabindex="-1">
      <div class="filterSheetHeader">
        <h2 id="filterSheetTitle">Filters</h2>
        <button type="button" class="modal-close" id="filterSheetClose" aria-label="Close filters">
          <span class="material-symbols-rounded icon-medium">close</span>
        </button>
      </div>
      <aside class="facets">
        <div id="facet-players"></div>
        <div id="facet-playing-time"></div>
        <div id="facet-weight"></div>
        <div id="facet-categories"></div>
        <div id="facet-mechanics"></div>
        <div id="facet-bgg-status"></div>
        <div id="facet-collection-owners"></div>
        <div id="facet-never-played"></div>
        <div id="facet-min-age"></div>
        <div id="facet-previous-players"></div>
        <div id="facet-numplays"></div>
        <div class="clear-all" id="clear-all"></div>
      </aside>
      <div class="filterSheetFooter">
        <button type="button" class="primary-btn" id="filterSheetApply">Show results</button>
      </div>
    </div>
  </div>
  <article class="wrapper">
    <main class="results">
      <div class="hits" id="hits">
        <div class="loading"><span class="loadingSpinner" aria-hidden="true"></span>Opening the chest…</div>
      </div>
      <div id="pagination"></div>
    </main>
  </article>

  <!-- HTML Templates -->
  <template id="filter-item-template">
    <label class="filter-item">
      <div class="filter-item-main">
        <input type="" name="" value="">
        <span class="filter-label"></span>
      </div>
      <span class="facet-count"></span>
    </label>
  </template>

  <template id="game-card-template">
    <details class="game-card" data-color="">
      <summary class="game-summary">
        <div class="game-cover">
          <img src="" alt="" class="game-image" loading="lazy">
          <div class="expansionStack" hidden></div>
          <span class="expansionMatchBadge" hidden>Expansion match</span>
          <span class="gameRatingBadge" hidden></span>
        </div>
        <div class="gameSummaryMeta">
          <span class="gameSummaryName"></span>
          <span class="gameSummaryInfo"></span>
          <span class="gameSummaryExpansions"></span>
        </div>
      </summary>
      <div class="game-details" role="dialog" aria-modal="true" tabindex="-1">
        <div class="card-header">
          <div class="cover-image">
            <img src="" alt="" class="cover-image-img">
          </div>
          <div class="title-section">
            <h1 class="game-title"></h1>
            <div class="category-chips-container"></div>
          </div>
          <button type="button" class="close-button" aria-label="Close details">
            <span class="material-symbols-rounded icon-small">close</span>
          </button>
        </div>

        <div class="stats-bar">
          <div class="stat-item playing-time-stat" style="display: none;">
            <span class="material-symbols-rounded icon-themed">schedule</span>
            <span class="playing-time-value"></span>
          </div>
          <div class="stat-item players-stat" style="display: none;">
            <span class="material-symbols-rounded icon-themed">group_work</span>
            <span><span class="players-value"></span> players</span>
          </div>
          <div class="stat-item complexity-stat" style="display: none;">
            <div class="complexity-gauge-container"></div>
            <span class="complexity-name"></span>
          </div>
          <div class="stat-item min-age-stat" style="display: none;">
            <span class="material-symbols-rounded icon-themed">child_care</span>
            <span class="min-age-value"></span>
          </div>
        </div>

        <div class="description-section">
          <div class="teaser-text" data-full-text="">
          </div>
        </div>

        <div class="tags-section">
          <h2>Mechanics</h2>
          <div class="mechanic-chips-container"></div>
        </div>

        <div class="expansions-section" style="display: none;">
          <h2>In this box</h2>
          <div class="expansion-chips"></div>
        </div>

        <div class="personal-notes-section">
          <h2>My notes</h2>
          <div class="personal-tags" data-game-id=""></div>
          <textarea class="personal-note-input" rows="3" placeholder="Add a personal note..."></textarea>
          <input type="text" class="personal-tag-input" placeholder="Add tags separated by commas">
          <button type="button" class="save-note-btn">Save note</button>
        </div>

        <div class="bottom-info">
          <div class="stat-item rating-section" style="display: none;">
            <div class="rating-gauge-container"></div>
            <span>Rating</span>
          </div>
          <div class="stat-item rank-section" style="display: none;">
            <span class="material-symbols-rounded icon-themed">stars</span>
            <span>Rank: <span class="rank-value"></span></span>
          </div>
          <div class="stat-item plays-section">
            <span class="material-symbols-rounded icon-themed">timer_play</span>
            <span><span class="numplays-value"></span> plays</span>
          </div>
          <div class="stat-item bgg-link-section">
            <span class="material-symbols-rounded icon-themed">outbound</span>
            <a href="" target="_blank" class="bgg-link">View on BGG</a>
          </div>
        </div>
      </div>
    </details>
  </template>

  <template id="expansion-chip-template">
    <a href="" target="_blank" class="expansion-chip"></a>
  </template>

  <template id="expansion-tile-template">
    <a href="" target="_blank" class="expansion-tile">
      <img src="" alt="" class="expansion-thumb" loading="lazy">
      <span class="expansion-tile-name"></span>
    </a>
  </template>

  <template id="expansions-toggle-template">
    <button class="more-button expansions-toggle" onclick="handleExpansionsToggle(this)"></button>
  </template>

  <template id="category-chip-template">
    <span class="tag-chip category-chip"></span>
  </template>

  <template id="mechanic-chip-template">
    <span class="tag-chip mechanic-chip"></span>
  </template>

  <template id="complexity-gauge-template">
    <svg class="complexity-gauge" width="24" height="24" viewBox="0 0 24 24" style="display: block;">
      <circle class="gauge-bg" cx="12" cy="12" r="10" />
      <circle class="gauge-fg" cx="12" cy="12" r="10" stroke-dasharray="" stroke-dashoffset="" />
      <text class="gauge-text" x="12" y="12" dy=".3em"></text>
    </svg>
  </template>

  <template id="rating-gauge-template">
    <svg class="complexity-gauge rating-gauge" width="24" height="24" viewBox="0 0 24 24" style="display: block;">
      <circle class="gauge-bg" cx="12" cy="12" r="10" />
      <circle class="gauge-fg" cx="12" cy="12" r="10" stroke-dasharray="" stroke-dashoffset="" />
      <text class="gauge-text" x="12" y="12" dy=".3em"></text>
    </svg>
  </template>

  <template id="error-template">
    <div class="error">
      <h2>⚠️ Database Loading Error</h2>
      <pre class="error-message"></pre>
    </div>
  </template>

  <template id="no-results-template">
    <div class="no-results">
      <span class="material-symbols-rounded" aria-hidden="true">search_off</span>
      <h2>No games match</h2>
      <p>Try removing a filter or two.</p>
      <button type="button" class="secondary-btn" onclick="clearAllFilters()">Clear all filters</button>
    </div>
  </template>

  <template id="pagination-template">
    <div class="pagination"></div>
  </template>

  <template id="pagination-button-template">
    <button class="pagination-btn"></button>
  </template>

  <template id="pagination-ellipsis-template">
    <span>...</span>
  </template>

  <template id="tag-chips-container-template">
    <div class="tag-chips"></div>
  </template>

  <template id="more-button-template">
    <button class="more-button" onclick="handleMoreButtonClick(this)">more</button>
  </template>

  <template id="less-button-template">
    <button class="more-button" onclick="handleMoreButtonClick(this)">less</button>
  </template>

  <template id="filter-dropdown-template">
    <details class="filter-dropdown">
      <summary><span class="material-symbols-rounded icon-medium">filter_list</span> <span class="filter-title"></span></summary>
      <div class="filter-dropdown-content"></div>
    </details>
  </template>

  <template id="game-grid-template">
    <div class="game-grid"></div>
  </template>

  <div class="modal-overlay" id="feature-modal" hidden>
      <div class="modal-panel" id="featureModalPanel" role="dialog" aria-modal="true" aria-labelledby="feature-modal-title" tabindex="-1">
      <div class="modal-header">
        <h2 id="feature-modal-title"></h2>
        <button type="button" class="modal-close" id="feature-modal-close" aria-label="Close">
          <span class="material-symbols-rounded icon-medium">close</span>
        </button>
      </div>
      <div class="modal-body" id="feature-modal-body"></div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="app-sqlite.js"></script>
  <script src="features.js"></script>
  <script src="ui.js"></script>
</body>
</html>
